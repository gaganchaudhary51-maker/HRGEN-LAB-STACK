services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrgen_lis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD in .env}
    volumes:
      - hrgen_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrgen_lis"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hrgen_app:${POSTGRES_APP_PASSWORD}@postgres:5432/hrgen_lis
      MIGRATION_DATABASE_URL: postgresql://hrgen_migrator:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/hrgen_lis
      LICENSE_FILE: ${LICENSE_FILE:-/app/license.json}
      LICENSE_MODE: ${LICENSE_MODE:-OFF}
    ports:
      - "3001:3001"
      - "2575:2575"
    volumes:
      - hrgen_backupdata:/app/data/backups
      - hrgen_pwa_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  hrgen_backupdata:
  hrgen_pwa_data:
  hrgen_pgdata:

d:rgba(0,0,0,.45);z-index:80;display:flex;justify-content:flex-end}.drawer .panel{width:min(560px,96vw);height:100%;background:#0f131a;padding:20px;overflow:auto}.login-actions{display:flex;justify-content:flex-end;margin-top:6px}.muted{color:var(--muted)}.small{font-size:12px}.hero{padding:20px}.hero .big{font-size:24px;font-weight:800}.module-cards{grid-template-columns:repeat(4,minmax(0,1fr))}.module-card{padding:16px;min-height:120px}.module-card .n{font-size:11px;color:var(--muted)}.progress{height:8px;background:#212630;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#6e5fff,#a796ff);width:100%}@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.module-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.side{width:210px}}@media(max-width:780px){.side{position:fixed;left:-260px;transition:.2s;z-index:70}.side.open{left:0}.main{padding:14px}.kpi-grid,.module-cards,.two,.three,.form-grid,.form-grid.three-col{grid-template-columns:1fr}.top{position:static}.mobile-menu{display:block!important}.top-actions .pill{display:none}}

/* GIA UX-C v1: adaptive + calm + spatial layer */
.gia-orb{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:radial-gradient(circle at 35% 30%,#b8b0ff,#6f5dff 42%,#201a48 75%);box-shadow:0 16px 48px rgba(76,59,180,.38),inset 0 1px 12px rgba(255,255,255,.35);z-index:110;display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:-.03em;transition:transform .28s ease,box-shadow .28s ease}.gia-orb:hover{transform:translateY(-3px) scale(1.03)}
.gia-orb.listening{animation:giaBreath 1.5s ease-in-out infinite}.gia-orb:focus-visible{outline:3px solid #b8b0ff;outline-offset:3px}
@keyframes giaBreath{0%,100%{box-shadow:0 16px 48px rgba(76,59,180,.38),0 0 0 0 rgba(129,114,255,.35)}50%{box-shadow:0 16px 48px rgba(76,59,180,.55),0 0 0 13px rgba(129,114,255,0)}}
.spatial-shell{perspective:1400px;transform-style:preserve-3d}.spatial-shell .card{transform:translateZ(0);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s ease}.spatial-shell .card:hover{transform:translateY(-2px) rotateX(.8deg) rotateY(-.8deg) translateZ(8px);box-shadow:0 28px 70px rgba(0,0,0,.34)}
.spatial-badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
.gia-adaptive{display:flex;gap:8px;align-items:center}.gia-adaptive .state{font-size:10px;color:var(--muted)}
.gia-command-hint{font-size:11px;color:var(--muted);padding:0 4px}.gia-voice-panel{position:fixed;right:18px;bottom:88px;width:min(380px,calc(100vw - 36px));padding:16px;background:rgba(15,19,27,.94);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.11);border-radius:20px;box-shadow:0 25px 80px rgba(0,0,0,.45);z-index:109}.gia-voice-panel[hidden]{display:none}.gia-voice-panel .wave{display:flex;align-items:center;gap:4px;height:28px}.gia-voice-panel .wave i{display:block;width:3px;height:8px;border-radius:9px;background:#a69cff;animation:giaWave .9s ease-in-out infinite}.gia-voice-panel .wave i:nth-child(2){animation-delay:.1s}.gia-voice-panel .wave i:nth-child(3){animation-delay:.2s}.gia-voice-panel .wave i:nth-child(4){animation-delay:.3s}.gia-voice-panel .wave i:nth-child(5){animation-delay:.4s}@keyframes giaWave{50%{height:24px}}
.gia-spatial-canvas{width:100%;height:280px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:radial-gradient(circle at 50% 40%,#1c2040,#080a0f 70%);display:block}.gia-spatial-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:780px){.gia-orb{right:14px;bottom:14px;width:52px;height:52px}.gia-voice-panel{bottom:76px}.spatial-shell .card:hover{transform:none}}

<div id="login" class="login">
  <div class="card login-card">
    <div class="brand">HRGen <span>GIA</span> LIMS</div>
    <h1>Laboratory Operating System</h1><p>Single server-authoritative workspace. External providers remain explicit until configured.</p>
    <form id="loginForm" class="stack">
      <div class="field"><label>Tenant</label><input id="loginTenant" placeholder="default" value="default"></div>
      <div class="field"><label>Username</label><input id="loginUser" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
      <div class="login-actions"><button class="primary">Sign in</button></div>
    </form>
    <div id="loginMsg" class="small muted" style="margin-top:12px"></div>
  </div>
</div>
<div id="app" class="app hidden">
  <aside id="side" class="side"><div class="brand">HRGen <span>GIA</span><div class="small muted">v6.0.0 • 77 BUILD</div></div><div id="nav" class="nav"></div></aside>
  <main class="main">
    <div class="top"><button class="mobile-menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button><div class="search"><input id="globalSearch" placeholder="Search patients, orders, modules…  Ctrl+K"></div><div class="top-actions"><button aria-label="Start GIA voice assistant" onclick="voiceStart()">🎙 GIA</button><span id="rolePill" class="pill">—</span><span id="conn" class="pill">Online</span><button onclick="logout()">Logout</button></div></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<div id="command" class="command hidden"><div class="box"><input id="cmdInput" placeholder="Type a command…"><div id="cmdItems" class="items"></div></div></div>
<script>

// Visual verification mock injection
window.api = async function(path, opt={}, meta={}) {
  if (path.startsWith('/api/admin/policy')) {
    return {
      version: 1, mode: 'STANDARD',
      policy: {
        workflow: { enabled: true, skipAllowed: [] },
        barcode: { enabled: true, required: false, format: 'CODE128', prefix: 'LAB' },
        labels: { enabled: true, widthMm: 50, heightMm: 25, showPatient: true },
        print: { report: 'A4', label: 'THERMAL_50X25', autoPrint: false }
      }
    };
  }
  if (path.startsWith('/api/branding')) {
    return {
      branding: {
        name: 'Apex Diagnostic & Reference Pathology Laboratory',
        address: 'Plot 42, Health City, Sector 12, New Delhi - 110025',
        phone: '+91 98765 43210',
        email: 'reports@apexdiagnostics.in',
        nablReg: 'MC-2491 (ISO 15189:2022 Validated)',
        domain: 'https://apexdiagnostics.in',
        pathologistName: 'Dr. Vikram Malhotra',
        pathologistQualification: 'MD, DNB (Pathology), Senior Consultant',
        pathologistRegistration: 'DMC / MCI-64821',
        signatureName: 'Dr. V. Malhotra',
        printMode: 'FULL_LETTERHEAD',
        headerMarginMm: 0,
        footerMarginMm: 0,
        primary: '#4f46e5',
        accent: '#e11d48'
      }
    };
  }
  if (path.startsWith('/api/entitlements')) {
    return { plan: 'ENTERPRISE', features: [], limits: { seats: 100, branches: 10, reports: 10000 } };
  }
  return {};
};

setTimeout(() => {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  S.token = 'mock-token';
  S.role = 'admin';
  S.user = { displayName: 'Dr. V. Malhotra', username: 'admin' };
  setNav();
  show('settings');
}, 100);

const S={token:sessionStorage.getItem('gia_token')||'',tenantId:sessionStorage.getItem('gia_tenant')||'default',user:JSON.parse(sessionStorage.getItem('gia_user')||'null'),role:sessionStorage.getItem('gia_role')||'',view:'dashboard',orders:[],patients:[],catalog:[]};
const MODULES=[
{id:'dashboard',icon:'⌂',name:'Command Center',group:'Operate',roles:['admin','pathologist','tech','phlebotomist'],feature:'CORE'},
{id:'opd',icon:'＋',name:'OPD Reception',group:'Operate',roles:['admin','tech','phlebotomist'],feature:'PATIENT'},
{id:'patients',icon:'◉',name:'Patients',group:'Operate',roles:['admin','pathologist','tech','phlebotomist'],feature:'PATIENT'},
{id:'billing',icon:'₹',name:'Billing POS',group:'Operate',roles:['admin','tech'],feature:'BILLING'},
{id:'collection',icon:'⌁',name:'Sample Collection',group:'Operate',roles:['admin','phlebotomist','tech'],feature:'COLLECTION'},
{id:'barcode',icon:'▥',name:'Tube & Barcode',group:'Operate',roles:['admin','tech','phlebotomist'],feature:'PATIENT'},
{id:'worklist',icon:'▤',name:'Result Workbench',group:'Analyze',roles:['admin','pathologist','tech'],feature:'RESULTS'},
{id:'analyzer',icon:'⌘',name:'Analyzer Edge',group:'Analyze',roles:['admin','tech'],feature:'ANALYZER'},
{id:'qc',icon:'◒',name:'QC / Westgard',group:'Analyze',roles:['admin','pathologist','tech'],feature:'QC'},
{id:'reports',icon:'▧',name:'Reports',group:'Clinical',roles:['admin','pathologist','tech'],feature:'REPORTS'},
{id:'pathologist',icon:'✚',name:'Pathologist',group:'Clinical',roles:['admin','pathologist'],feature:'REPORTS'},
{id:'doctors',icon:'♙',name:'Doctor & Referral',group:'Commercial',roles:['admin','tech'],feature:'COMMISSIONS'},
{id:'inventory',icon:'▣',name:'Inventory',group:'Operations',roles:['admin','tech'],feature:'INVENTORY'},
{id:'home',icon:'⌖',name:'Home Collection',group:'Operations',roles:['admin','phlebotomist'],feature:'COLLECTION'},
{id:'b2b',icon:'◇',name:'B2B Network',group:'Commercial',roles:['admin'],feature:'B2B'},
{id:'finance',icon:'₿',name:'Finance & Closing',group:'Commercial',roles:['admin'],feature:'COMMISSIONS'},
{id:'analytics',icon:'◫',name:'MIS / Analytics',group:'Intelligence',roles:['admin','pathologist','tech'],feature:'MIS'},
{id:'compliance',icon:'✓',name:'Compliance',group:'Governance',roles:['admin','pathologist'],feature:'NABL_PACK'},
{id:'audit',icon:'◌',name:'Audit Trail',group:'Governance',roles:['admin','pathologist'],feature:'CORE'},
{id:'integrations',icon:'⇄',name:'Integrations',group:'Platform',roles:['admin'],feature:'API'},
{id:'gia',icon:'✦',name:'GIA AI',group:'Platform',roles:['admin','pathologist','tech'],feature:'AI'},
{id:'users',icon:'♟',name:'Users & Roles',group:'Admin',roles:['admin'],feature:'ROLE_EDITOR'},
{id:'features',icon:'◈',name:'Feature Packs',group:'Admin',roles:['admin'],feature:'ENTITLEMENTS'},
{id:'settings',icon:'⚙',name:'Settings',group:'Admin',roles:['admin'],feature:'CORE'}
];
const MODULE_BY_ID=Object.fromEntries(MODULES.map(m=>[m.id,m])); let ENT={plan:'STARTER',features:[],limits:{}};
function moduleEnabled(m){return !m||m.feature==='CORE'||ENT.plan==='CHAIN'||ENT.plan==='ENTERPRISE'||ENT.features.some(f=>f.key===m.feature&&f.enabled);}
function roleCan(m){return m.roles.includes(S.role)||S.role==='admin';}
function visibleModules(){return MODULES.filter(roleCan);}
function setNav(){const groups={};for(const m of visibleModules())(groups[m.group]??=[]).push(m);document.getElementById('nav').innerHTML=Object.entries(groups).map(([g,items])=>`<div class="nav-group">${esc(g)}</div>${items.map(m=>`<button class="${S.view===m.id?'active ':''}${moduleEnabled(m)?'':'locked'}" onclick="show('${m.id}')"><span>${m.icon}</span><span>${esc(m.name)}</span>${moduleEnabled(m)?'':'<span class="nav-lock">LOCK</span>'}</button>`).join('')}`).join('');document.getElementById('rolePill').textContent=`${S.user?.displayName||S.user?.username||'User'} • ${S.role}`;}
function shellBar(){return `<div class="shell-bar">${visibleModules().map(m=>`<button class="shell-chip ${S.view===m.id?'active':''}" onclick="show('${m.id}')">${m.icon} ${esc(m.name)}${moduleEnabled(m)?'':' · LOCKED'}</button>`).join('')}</div>`;}
const labels={dashboard:'Command Center',patients:'Patients',billing:'Billing POS',worklist:'Result Workbench',qc:'QC / Westgard',reports:'Reports',inventory:'Inventory',collection:'Sample Collection',b2b:'B2B Network',compliance:'Compliance',integrations:'Integrations',analytics:'MIS / Analytics',users:'Users & Roles',audit:'Audit Trail',features:'Feature Packs',settings:'Settings'};
async function queueOffline(path,opt){const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('gia-offline',1);r.onupgradeneeded=()=>r.result.createObjectStore('queue',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});const id='OFF-'+crypto.randomUUID();const action={id,idempotencyKey:id,path,method:opt.method||'POST',body:opt.body||null,createdAt:new Date().toISOString()};await new Promise((resolve,reject)=>{const tx=db.transaction('queue','readwrite');tx.objectStore('queue').put(action);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});return {queued:true,idempotencyKey:id}}
async function flushOffline(){if(!navigator.onLine||!S.token)return;try{const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('gia-offline',1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});const items=await new Promise((resolve,reject)=>{const tx=db.transaction('queue','readonly');const req=tx.objectStore('queue').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});for(const item of items){try{await api(item.path,{method:item.method,body:item.body,headers:{'X-Idempotency-Key':item.idempotencyKey}},{skipQueue:true});const tx=db.transaction('queue','readwrite');tx.objectStore('queue').delete(item.id)}catch{}}}catch(e){}}
async function api(path,opt={},meta={}){opt.headers={...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{}),...(S.token?{Authorization:'Bearer '+S.token}:{} )};try{const r=await fetch(path,opt);const text=await r.text();let d={};try{d=JSON.parse(text)}catch{d={raw:text}}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}catch(e){if(!meta.skipQueue&&navigator.onLine===false&&(opt.method||'GET')!=='GET'&&(opt.method||'GET')!=='DELETE'){return queueOffline(path,opt)}throw e}}
function toast(m,ok=true){const t=document.getElementById('toast');t.textContent=m;t.className='toast';setTimeout(()=>t.classList.add('hidden'),3200)}
function fmt(v){return Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
async function boot(){if(!S.token){return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');try{ENT=await api('/api/entitlements')}catch{} setNav();await show(S.view);}
async function show(v){S.view=v;setNav();document.getElementById('side').classList.remove('open');const V=document.getElementById('view');V.innerHTML='<div class="card section">Loading…</div>';try{const fn=views[v]||views.dashboard;V.innerHTML=shellBar()+await fn()}catch(e){V.innerHTML=`<div class="card section"><span class="bad badge">ERROR</span><p>${e.message}</p></div>`}}
function moduleLanding(title,desc,items){const m=MODULE_BY_ID[S.view];const on=moduleEnabled(m);return `<div class="module-head"><div><h2>${esc(title)}</h2><div class="muted">${esc(desc)}</div></div><span class="badge ${on?'ok':'warn'}">${on?'ENABLED':'PLAN LOCKED'}</span></div><div class="card section"><div class="grid ent-grid">${items.map(x=>`<div class="card ent-card"><div class="ent-head"><b>${esc(x)}</b><span class="badge ${on?'ok':'warn'}">${on?'READY':'LOCKED'}</span></div><div class="ent-desc">Phase A shell surface. Existing backend/API remains untouched; detailed workflow lands in the layer build.</div></div>`).join('')}</div></div>`;}
function opdDoctorOptions(){return S.opdDoctors.filter(x=>x.active!==false).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+(x.specialty?' • '+esc(x.specialty):'')+(x.commissionValue?' • '+esc(String(x.commissionValue))+(x.commissionType==='PERCENTAGE'?'%':''):'')+'</option>').join('')}
function opdDoctorRows(doctors){return doctors.map(x=>{const q=x.data||{};return '<tr><td>'+esc(q.name)+'</td><td>'+esc(q.specialty||'—')+'</td><td>'+esc(String(q.commissionValue||0))+(q.commissionType==='PERCENTAGE'?'%':' ₹')+'</td><td>'+esc(q.upiId||'—')+'</td></tr>'}).join('')||'<tr><td colspan=4 class=muted>No doctors configured</td></tr>'}

function renderBillingPatients(q=''){const sel=document.getElementById('billingPatientId'),info=document.getElementById('billingPatientMatches');if(!sel)return;const query=String(q||'').trim().toLowerCase();const rows=(S.billingPatients||[]).filter(p=>p.active!==false&&(!query||`${p.uhid||''} ${p.name||''} ${p.phone||''}`.toLowerCase().includes(query))).slice(0,100);const old=sel.value;sel.innerHTML='<option value="">Select patient</option>'+rows.map(p=>`<option value="${esc(p.id)}">${esc(p.uhid||p.id)} · ${esc(p.name)} · ${esc(p.phone||'')}</option>`).join('');if(rows.some(p=>p.id===old))sel.value=old;if(info)info.textContent=`${rows.length} matching patient(s)`;}
function renderBillingCatalog(q=''){const box=document.getElementById('billingCatalog');if(!box)return;const query=String(q||'').trim().toLowerCase();const rows=(S.catalog||[]).filter(t=>!query||`${t.code} ${t.name} ${t.department||''}`.toLowerCase().includes(query)).slice(0,40);box.innerHTML=rows.map(t=>`<button type="button" style="display:flex;justify-content:space-between;text-align:left" onclick="billingAddTest('${opdEscId(t.code)}')"><span><b>${esc(t.code)}</b> · ${esc(t.name)}<small class="muted" style="display:block">${esc(t.department||'')}</small></span><b>₹${fmt(t.price)}</b></button>`).join('')||'<span class="muted">No matching tests</span>';}
function billingAddTest(code){const t=(S.catalog||[]).find(x=>x.code===code);if(!t)return;if((S.billingBasket||[]).some(x=>x.code===code))return toast('Test already selected',false);S.billingBasket.push(t);renderBillingBasket();}
function billingRemoveTest(code){S.billingBasket=(S.billingBasket||[]).filter(x=>x.code!==code);renderBillingBasket();}
function renderBillingBasket(){const box=document.getElementById('billingBasket');if(!box)return;const gross=(S.billingBasket||[]).reduce((n,t)=>n+Number(t.price||0),0);const type=document.getElementById('billingDiscountType')?.value||'None',v=Math.max(0,Number(document.getElementById('billingDiscountValue')?.value||0));const discount=type==='Percentage'?Math.min(gross,gross*Math.min(v,100)/100):Math.min(gross,v);const net=Math.max(0,gross-discount);document.getElementById('billingGross').textContent=`₹${fmt(gross)} · Net ₹${fmt(net)}`;box.innerHTML=(S.billingBasket||[]).length?S.billingBasket.map(t=>`<div class="row" style="justify-content:space-between"><span><b>${esc(t.code)}</b> ${esc(t.name)}</span><span>₹${fmt(t.price)} <button type="button" onclick="billingRemoveTest('${opdEscId(t.code)}')">Remove</button></span></div>`).join(''):'<span class="muted">No tests selected</span>';const paid=document.querySelector('#orderForm [name="paidAmount"]');if(paid){paid.max=net.toFixed(2);if(Number(paid.value||0)>net)paid.value=net.toFixed(2)}}
function opdEscId(v){return String(v||'').replace(/[^A-Za-z0-9_-]/g,'')}
function renderOpdCatalog(q=''){
 const box=document.getElementById('opdCatalog'); if(!box)return; const s=String(q||'').toLowerCase(); const rows=S.opdCatalog.filter(x=>!s||`${x.code} ${x.name} ${x.department}`.toLowerCase().includes(s)).slice(0,60);
 box.innerHTML=rows.map(x=>`<button type="button" onclick="opdAddTest('${opdEscId(x.code)}')" style="display:flex;justify-content:space-between;align-items:center;text-align:left"><span><b>${esc(x.code)}</b> · ${esc(x.name)}<small class="muted" style="display:block">${esc(x.department||'')}</small></span><b>₹${fmt(x.price)}</b></button>`).join('')||'<span class="muted">No matching tests</span>'; renderOpdBasket();
}
function opdAddTest(code){const x=S.opdCatalog.find(t=>t.code===code);if(!x)return;if((S.opdBasket||[]).some(t=>t.code===code))return toast('Test already selected',false);S.opdBasket.push(x);renderOpdBasket()}
function opdRemoveTest(code){S.opdBasket=(S.opdBasket||[]).filter(t=>t.code!==code);renderOpdBasket()}
function renderOpdBasket(){const box=document.getElementById('opdBasket');if(!box)return;const gross=(S.opdBasket||[]).reduce((n,x)=>n+Number(x.price||0),0);document.getElementById('opdGross').textContent='₹'+fmt(gross);box.innerHTML=S.opdBasket.length?S.opdBasket.map(x=>`<div class="row" style="justify-content:space-between"><span><b>${esc(x.code)}</b> ${esc(x.name)}</span><span>₹${fmt(x.price)} <button type="button" onclick="opdRemoveTest('${opdEscId(x.code)}')">×</button></span></div>`).join(''):'<span class="muted">No tests selected</span>'}
async function opdRegister(e){e.preventDefault();if(!S.opdBasket?.length)return toast('Select at least one test',false);const f=new FormData(e.target);const body={title:f.get('title'),name:f.get('name'),phone:f.get('phone'),gender:f.get('gender'),age:{years:Number(f.get('years')),months:Number(f.get('months')),days:Number(f.get('days'))},doctorId:f.get('doctorId')||null,tests:S.opdBasket.map(x=>x.code),discountType:document.getElementById('opdDiscountType').value,discountValue:Number(document.getElementById('opdDiscountValue').value||0),paymentMode:document.getElementById('opdPaymentMode').value,paidAmount:Number(document.getElementById('opdPaid').value||0)};try{const d=await api('/api/opd/register',{method:'POST',body:JSON.stringify(body)});document.getElementById('opdResult').innerHTML=opdResultHTML(d);S.opdBasket=[];renderOpdBasket();toast(`Accession ${d.order.invoiceNumber} created`)}catch(err){toast(err.message,false)}}
function opdResultHTML(d){const o=d.order,p=d.patient;return `<div class="card section"><div class="module-head"><div><h3>Accession created: ${esc(o.invoiceNumber)}</h3><div class="muted">${esc(p.uhid)} • ${esc(p.name)} • ${esc(p.ageExact?.display||'')} • ${esc(p.gender)}</div></div><span class="badge ${o.balanceDue?'warn':'ok'}">${o.balanceDue?'DUE ₹'+fmt(o.balanceDue):'PAID'}</span></div><div class="grid three"><div class="card"><b>Gross</b><div class="plan-price">₹${fmt(o.grossAmount)}</div></div><div class="card"><b>Discount</b><div class="plan-price">₹${fmt(o.discountAmount)}</div></div><div class="card"><b>Net</b><div class="plan-price">₹${fmt(o.netPayable)}</div></div></div><div class="row" style="margin-top:12px;gap:8px"><button onclick="opdPrintLabels('${opdEscId(o.id)}')">Print ${d.labels?.length||0} Tube Label(s)</button>${d.upi?.status==='READY'?`<button onclick="opdShowQr('${opdEscId(o.id)}')">Show UPI QR</button>`:`<span class="badge warn">UPI ${esc(d.upi?.status||'NOT_CONFIGURED')}</span>`}<span class="pill">${esc(o.paymentMode)} • Paid ₹${fmt(o.paidAmount)} • Due ₹${fmt(o.balanceDue)}</span></div><div id="opdQr" style="margin-top:12px"></div></div>`}
async function opdShowQr(id){try{const d=await api('/api/opd/orders/'+encodeURIComponent(id)+'/upi');document.getElementById('opdQr').innerHTML=`<div class="card" style="display:inline-block;text-align:center"><img src="${d.qrDataUrl}" alt="Dynamic UPI QR" width="240" height="240"><div><b>Pay ₹${fmt(d.amount)}</b><div class="small muted">${esc(d.upiId)}</div></div></div>`}catch(e){toast(e.message,false)}}
async function opdPrintLabels(id){try{const d=await api('/api/opd/orders/'+encodeURIComponent(id)+'/labels');const w=window.open('about:blank','_blank','noopener');if(!w)return toast('Popup blocked',false);w.document.write(`<!doctype html><html><head><title>Tube Labels ${esc(id)}</title><style>@page{size:50mm 25mm;margin:0}html,body{margin:0;padding:0}body{font-family:Arial,sans-serif;background:white;color:black}.label{width:50mm;height:25mm;box-sizing:border-box;padding:1.5mm;page-break-after:always;overflow:hidden}.name{font-size:9pt;font-weight:700;white-space:nowrap;overflow:hidden}.meta{font-size:6.5pt;white-space:nowrap}.tube{font-size:7pt;font-weight:700}.bar{margin-top:1mm}.tests{font-size:5.8pt;white-space:nowrap;overflow:hidden}</style></head><body>${d.labels.map(l=>`<div class="label"><div class="name">${esc(l.patientName)} • ${esc(l.gender)}</div><div class="meta">${esc(l.uhid)} • ${esc(l.age)} • ${esc(l.barcode)}</div><div class="tube">${esc(l.tubeColor)} / ${esc(l.sampleType)}</div><div class="bar">${l.code128Svg}</div><div class="tests">${esc(l.testCodes.join(', '))}</div></div>`).join('')}</body></html>`);w.document.close();setTimeout(()=>w.print(),250)}catch(e){toast(e.message,false)}}

function actionBtn(o,action,label,state){return o.pipelineStatus===state?`<button onclick="workflowAction('${o.id}','${action}')">${label}</button>`:''}
function esc(v){return String(v??'').replace(/[&<>'"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]))}
function badge(v,kind){const cls=kind||(String(v).includes('FAIL')||String(v).includes('CRITICAL')?'bad':String(v).includes('PENDING')||String(v).includes('REVIEW')?'warn':'ok');return `<span class="badge ${cls}">${esc(v)}</span>`}
function quick(v){show(v)}
function patientFormHTML(){return `<div class="drawer" id="pf"><div class="panel"><h2>Register Patient</h2><form id="patientForm" class="stack"><input name="name" placeholder="Full name" required><div class="form-grid"><input name="age" type="number" placeholder="Age" required><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></div><input name="phone" placeholder="Phone" required><input name="referredBy" placeholder="Referred by"><select name="type"><option>OPD</option><option>B2B</option><option>HOME</option></select><button class="primary">Register</button><button type="button" onclick="document.getElementById('pf').remove()">Cancel</button></form></div></div>`}
function openPatientForm(){const x=document.createElement('div');x.innerHTML=patientFormHTML();document.body.appendChild(x.firstElementChild)}
function previewImageFile(input,targetInputId,previewContainerId){if(!input.files||!input.files[0])return;const file=input.files[0];if(file.size>400000){toast('Image size exceeds 400KB. Choose a smaller image.',false);input.value='';return}const reader=new FileReader();reader.onload=e=>{const res=e.target.result;const target=document.getElementById(targetInputId);if(target)target.value=res;const prev=document.getElementById(previewContainerId);if(prev)prev.innerHTML=`<img src="${res}" style="max-height:60px;border-radius:4px">`;toast('Image loaded! Save to apply.');};reader.readAsDataURL(file)}
function openVerify(token){window.open('/verify/'+encodeURIComponent(token),'_blank','noopener')}
async function checkIntegrity(id){try{const d=await api('/api/orders/'+encodeURIComponent(id)+'/integrity');const el=document.getElementById('integrity-'+id);if(el){el.textContent=d.verified?'VERIFIED':'FAILED';el.className='pill '+(d.verified?'ok':'bad')}}catch(e){toast(e.message,false)}}
async function openVersions(id){try{const d=await api('/api/orders/'+encodeURIComponent(id)+'/versions');const rows=(d.versions||[]).map(v=>`v${v.version} • ${esc(v.reason||'—')} • ${esc(v.createdAt||'')}`).join('\n');alert('Original: '+(d.original?.reportVersion||1)+'\n\n'+(rows||'No amendments'))}catch(e){toast(e.message,false)}}
async function loadPatientOrders(id){const patient=S.patients.find(p=>p.id===id);if(!patient)return;const d=await api('/api/orders');const rows=d.orders.filter(o => o.patientId === id && o.patient?.id === id);toast(`History: ${rows.length} orders`)}
async function editResults(id){
 const o=S.orders.find(x=>x.id===id)||(await api('/api/orders')).orders.find(x=>x.id===id);if(!o)return;
 if(['VALIDATED','RELEASED'].includes(o.pipelineStatus))return toast('Validated/released report is immutable. Use amendment workflow.',false);
 const tests=o.tests||[];if(!tests.length)return toast('No tests on this accession',false);
 const overlay=document.createElement('div');overlay.className='drawer';overlay.id='resultEditor';
 overlay.innerHTML=`<div class="panel" style="width:min(1050px,98vw)"><div class="module-head"><div><h2>Result Entry</h2><div class="muted">${esc(o.patient?.name||'Patient')} · ${esc(o.invoiceNumber||o.barcode)} · ${esc(o.barcode)}</div></div><button type="button" onclick="document.getElementById('resultEditor')?.remove()">Close</button></div><div class="small muted" style="margin-bottom:12px">Enter measured values only. Units and reference intervals come from the configured test catalogue. Select flags according to the validated laboratory procedure; save does not validate or release the report.</div><form id="resultEntryForm"><div style="overflow:auto"><table class="table"><thead><tr><th>Test</th><th>Result value</th><th>Unit</th><th>Reference interval</th><th>Flag</th><th>Method</th></tr></thead><tbody>${tests.map((t,i)=>`<tr><td><b>${esc(t.code)}</b><div class="small muted">${esc(t.name)}</div></td><td><input name="value_${i}" value="${esc(t.value==='Pending'?'':t.value)}" placeholder="Enter result" style="min-width:110px" aria-label="${esc(t.name)} result"></td><td>${esc(t.unit||'—')}</td><td>${esc(t.reference||'—')}</td><td><select name="status_${i}" aria-label="${esc(t.name)} flag"><option ${t.status==='Pending'?'selected':''}>Pending</option><option ${t.status==='Normal'?'selected':''}>Normal</option><option ${t.status==='High'?'selected':''}>High</option><option ${t.status==='Low'?'selected':''}>Low</option><option ${t.status==='Critical'?'selected':''}>Critical</option></select></td><td><input name="method_${i}" value="${esc(t.method||'Automated Analyzer')}" style="min-width:150px" aria-label="${esc(t.name)} method"></td></tr>`).join('')}</tbody></table></div><div class="row" style="justify-content:space-between;margin-top:14px"><span class="small muted">Blank results remain Pending; no automatic normal classification is applied.</span><button class="primary" type="submit">Save results as draft</button></div></form></div>`;
 document.body.appendChild(overlay);
 document.getElementById('resultEntryForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const out=tests.map((t,i)=>{const value=String(f.get('value_'+i)||'').trim();return {...t,value:value||'Pending',status:value?String(f.get('status_'+i)||'Pending'):'Pending',method:String(f.get('method_'+i)||'').trim()||'Manual entry'}});try{await api('/api/orders/'+encodeURIComponent(id)+'/results',{method:'PUT',body:JSON.stringify({tests:out})});overlay.remove();toast('Results saved as draft; QC/validation still required');show('worklist')}catch(err){toast(err.message,false)}});
}

async function printOrder(id){const o=S.orders.find(x=>x.id===id)||(await api('/api/orders')).orders.find(x=>x.id===id);if(!o)return;const p=o.patient||{},b=(o.pipelineStatus==='RELEASED'&&o.reportSnapshot?.lab)?o.reportSnapshot.lab:await getLabBranding();const labName=b.name||'Laboratory Name Not Configured';const logoSrc=b.logoDataUrl||b.logoUrl||'';const logo=logoSrc?`<img class="logo" src="${esc(logoSrc)}" alt="Laboratory logo">`:'';const status=o.pipelineStatus==='RELEASED'?'LABORATORY INVESTIGATION REPORT':'DRAFT REPORT — NOT FOR CLINICAL USE';const isPrePrinted=b.printMode==='PRE_PRINTED';const rows=(o.tests||[]).map(t=>{const flagClass=t.status==='Critical'||t.isPanic?'flag-critical':t.status==='High'?'flag-high':t.status==='Low'?'flag-low':'';return `<tr><td><b>${esc(t.name)}</b><div class="muted">${esc(t.code)} · Method: ${esc(t.method||'Automated')}</div></td><td><b>${esc(t.value||'Pending')}</b></td><td>${esc(t.unit||'—')}</td><td>${esc(t.reference||'—')}</td><td class="${flagClass}">${esc(t.status||'Normal')}</td></tr>`}).join('');const signer=o.signoff||{};const sigImgSrc=b.signatureDataUrl||'';const sigImg=sigImgSrc?`<img class="sig-img" src="${esc(sigImgSrc)}" alt="Doctor signature">`:'';const headClass=isPrePrinted?'head pre-printed-pad':'head';const html=`<header class="${headClass}">${logo}<div><h1>${esc(labName)}</h1><div>${esc(b.address||'Laboratory address not configured')}</div><div class="muted">${esc(b.phone||'')} ${b.email?' · '+esc(b.email):''} ${b.nablReg?' · Reg: '+esc(b.nablReg):''}</div></div></header><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><h2 style="margin:0">${status}</h2><span class="muted" style="font-weight:600">Page 1 of 1</span></div><section class="meta"><div><b>Patient Name:</b> ${esc(p.title||'')} ${esc(p.name||'—')}</div><div><b>UHID:</b> ${esc(p.uhid||p.id||'—')}</div><div><b>Age / Gender:</b> ${esc(p.ageExact?.display||p.age||'—')} / ${esc(p.gender||'—')}</div><div><b>Accession / Inv:</b> ${esc(o.invoiceNumber||'—')}</div><div><b>Sample Barcode:</b> ${esc(o.barcode||'—')}</div><div><b>Registered:</b> ${esc(o.createdAt?new Date(o.createdAt).toLocaleString('en-IN'):'—')}</div><div><b>Referred By:</b> ${esc(p.referredBy||'Self / Direct')}</div><div><b>Authorized Date:</b> ${esc(o.releasedAt?new Date(o.releasedAt).toLocaleString('en-IN'):'Pending')}</div></section><table><thead><tr><th style="width:36%">Test / Investigation</th><th style="width:18%">Observed Value</th><th style="width:14%">Unit</th><th style="width:20%">Biological Ref. Interval</th><th style="width:12%">Flag</th></tr></thead><tbody>${rows}</tbody></table><div class="foot"><div><b>Report Verification:</b><div class="muted">Digital Token: <code>${esc(o.verificationToken||'Draft-Not-Released')}</code></div><div class="muted">Verify Authenticity: ${location.origin}/verify/${esc(o.verificationToken||'')}</div>${b.nablReg?`<div class="muted">Quality Accredited: ${esc(b.nablReg)}</div>`:''}</div><div class="sig-box">${sigImg}<div style="font-weight:700">${esc(signer.pathologist||b.signatureName||b.pathologistName||'Dr. Authorized Pathologist')}</div><div class="muted">${esc(b.pathologistQualification||'MD (Pathology)')}</div><div class="muted">${esc(signer.pathologistMci||b.pathologistRegistration||'Reg: MCI/State Council')}</div><div class="muted">${o.pipelineStatus==='RELEASED'?'Digitally Signed & Released':'Authorization Pending'}</div></div></div><div class="disclaimer">Biological Reference Intervals are method and population dependent. Critical or panic values require clinical correlation. Reports are authorized electronically under 21 CFR Part 11 compliant audit trail.</div>`;openPrintDocument(o.barcode||'Laboratory report',html)}
async function printBill(id){const [d,c,branding]=await Promise.all([api('/api/orders'),api('/api/catalog'),getLabBranding()]);const o=d.orders.find(x=>x.id===id);if(!o)return toast('Order not found',false);const p=o.patient||{},b=branding,catalog=c.catalog||[];const rows=(o.tests||[]).map(t=>{const item=catalog.find(x=>x.code===t.code);return `<tr><td>${esc(t.name)} <span class="muted">(${esc(t.code)})</span></td><td>₹${fmt(t.price??item?.price??0)}</td></tr>`}).join('');const gross=Number(o.grossAmount||0),discount=Number(o.discountAmount||Math.max(0,gross-Number(o.netPayable||0))),net=Number(o.netPayable||0);const html=`<header class="head">${b.logoUrl?`<img class="logo" src="${esc(b.logoUrl)}" alt="Lab logo">`:''}<div><h1>${esc(b.name||'Laboratory Name Not Configured')}</h1><div>${esc(b.address||'Laboratory address not configured')}</div><div class="muted">${esc(b.phone||'')} ${esc(b.email||'')}</div></div></header><h2>Patient Invoice / Receipt</h2><section class="meta"><div><b>Invoice</b>${esc(o.invoiceNumber||'—')}</div><div><b>Date</b>${esc(o.createdAt||'—')}</div><div><b>Patient</b>${esc(p.name||'—')}</div><div><b>UHID</b>${esc(p.uhid||p.id||'—')}</div><div><b>Barcode</b>${esc(o.barcode||'—')}</div><div><b>Payment mode</b>${esc(o.paymentMode||'Cash')}</div></section><table><thead><tr><th>Test / Service</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table><table><tbody><tr><th>Gross</th><td>₹${fmt(gross)}</td></tr><tr><th>Discount</th><td>₹${fmt(discount)}</td></tr><tr><th>Net payable</th><td><b>₹${fmt(net)}</b></td></tr><tr><th>Paid</th><td>₹${fmt(o.paidAmount||0)}</td></tr><tr><th>Balance due</th><td><b>₹${fmt(o.balanceDue||0)}</b></td></tr></tbody></table><p><b>Payment status:</b> ${esc(o.paymentStatus||((Number(o.balanceDue||0)===0)?'PAID':Number(o.paidAmount||0)>0?'PARTIAL':'DUE'))}</p><p class="muted">Computer-generated receipt. Please retain invoice number for billing queries.</p>`;openPrintDocument(o.invoiceNumber||'Invoice',html)}
async function workflowAction(id,action){const o=S.orders.find(x=>x.id===id)||(await api('/api/orders')).orders.find(x=>x.id===id);if(!o)return;try{if(action==='delta'){const d=await api('/api/orders/'+encodeURIComponent(id)+'/delta-check',{method:'POST',body:JSON.stringify({config:{maxDays:30,percentLimit:30}})});toast('Delta check: '+d.results.map(x=>x.result.status).join(', '));}

else if(action==='validate'){await api('/api/orders/'+encodeURIComponent(id)+'/validate',{method:'POST',body:'{}'});toast('Report validated')}
else if(action==='signoff'){const password=prompt('Pathologist password re-authentication');if(password===null)return;await api('/api/orders/'+encodeURIComponent(id)+'/signoff',{method:'POST',body:JSON.stringify({password})});toast('E-signature recorded')}
else if(action==='release'){const deltaReview=(o.deltaChecks||[]).some(x=>x.result?.status==='REVIEW');await api('/api/orders/'+encodeURIComponent(id)+'/release',{method:'POST',body:JSON.stringify({deltaReviewed:!deltaReview||confirm('Delta REVIEW exists. Confirm reviewed.')})});toast('Report released')}
else if(action==='print'){return printOrder(id)}
show('worklist')}catch(e){toast(e.message,false)}}

async function runCommand(q){try{const d=await api('/api/ai/voice-command',{method:'POST',body:JSON.stringify({transcript:q})});const map={OPEN_PATIENTS:'patients',OPEN_BILLING:'billing',OPEN_RESULTS:'worklist',OPEN_QC:'qc',OPEN_INVENTORY:'inventory',OPEN_COLLECTION:'collection',OPEN_ANALYTICS:'analytics'};if(map[d.intent])return show(map[d.intent]);}catch{}const t=q.toLowerCase();if(t.includes('patient'))return show('patients');if(t.includes('billing')||t.includes('bill'))return show('billing');if(t.includes('result'))return show('worklist');if(t.includes('qc'))return show('qc');if(t.includes('inventory')||t.includes('reagent'))return show('inventory');if(t.includes('collection'))return show('collection');if(t.includes('analytics')||t.includes('mis')||t.includes('revenue'))return show('analytics');toast('Command not mapped: '+q,false)}

function giaUXInit(){
  document.body.classList.add('spatial-shell');
  const top=document.querySelector('.top');
  if(top&&!document.getElementById('giaAdaptive')){
    const wrap=document.createElement('div');wrap.className='gia-adaptive';wrap.id='giaAdaptive';
    wrap.innerHTML='<span class="pill spatial-badge" id="giaSpatialState">CALM</span><span class="gia-adaptive state" id="giaAdaptiveState">Adaptive</span><button type="button" onclick="giaToggleSpatial()" title="Toggle spatial mode">Spatial</button>';
    top.appendChild(wrap);
  }
  if(!document.getElementById('giaOrb')){
    const b=document.createElement('button');b.id='giaOrb';b.className='gia-orb';b.type='button';b.title='Ask GIA';b.setAttribute('aria-label','Ask GIA by voice');b.textContent='GIA';b.onclick=giaVoiceToggle;document.body.appendChild(b);
    const p=document.createElement('section');p.id='giaVoicePanel';p.className='gia-voice-panel';p.hidden=true;p.setAttribute('aria-live','polite');p.innerHTML='<div class="row" style="justify-content:space-between"><b>GIA interaction</b><button type="button" onclick="giaVoiceClose()">Close</button></div><div class="small muted" id="giaVoiceText" style="margin-top:8px">Press GIA or F2 and speak a command.</div><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="gia-command-hint">Try: “open patients”, “open QC”, “open billing”.</div>';document.body.appendChild(p);
  }
  giaUpdateAdaptive();
  window.addEventListener('resize',giaUpdateAdaptive,{passive:true});
  if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)document.body.classList.add('motion-reduce');
}

function giaToggleSpatial(){document.body.classList.toggle('spatial-shell');const on=document.body.classList.contains('spatial-shell');const b=document.getElementById('giaSpatialState');if(b)b.textContent=on?'SPATIAL':'CALM';}
function giaVoiceClose(){const p=document.getElementById('giaVoicePanel'),o=document.getElementById('giaOrb');if(p)p.hidden=true;if(o)o.classList.remove('listening')}
function giaVoiceToggle(){const p=document.getElementById('giaVoicePanel'),o=document.getElementById('giaOrb');if(!p||!o)return;p.hidden=false;o.classList.add('listening');if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){document.getElementById('giaVoiceText').textContent='Voice input unavailable. Use Ctrl/⌘+K command palette.';o.classList.remove('listening');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;const rec=new R();rec.lang=document.documentElement.lang==='hi-IN'?'hi-IN':'en-IN';rec.interimResults=true;rec.maxAlternatives=1;rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript;document.getElementById('giaVoiceText').textContent=t;if(e.results[e.results.length-1].isFinal){o.classList.remove('listening');runCommand(t)}};rec.onerror=()=>{document.getElementById('giaVoiceText').textContent='Voice capture failed. Use command palette.';o.classList.remove('listening')};rec.onend=()=>o.classList.remove('listening');rec.start();}
function giaSpatialView(){return `<div class="card section"><div class="module-head"><div><h3>Spatial Command Surface</h3><div class="muted">CSS 3D spatial mode with WebXR capability detection. No device capability is assumed.</div></div><span class="badge" id="xrStatus">Checking WebXR…</span></div><canvas id="giaSpatialCanvas" class="gia-spatial-canvas" width="1200" height="560" aria-label="Spatial laboratory command surface"></canvas><div class="gia-spatial-actions"><button class="primary" type="button" onclick="giaLaunchXR()">Launch immersive XR</button><button type="button" onclick="giaSpatialReset()">Reset view</button></div></div>`}
function giaSpatialReset(){const c=document.getElementById('giaSpatialCanvas');if(!c)return;giaDrawSpatial(c,0,0)}
function giaDrawSpatial(c,rx=0,ry=0){const x=c.getContext('2d');const w=c.width,h=c.height;x.clearRect(0,0,w,h);const g=x.createRadialGradient(w*.5,h*.38,10,w*.5,h*.5,w*.7);g.addColorStop(0,'#27264f');g.addColorStop(1,'#07090e');x.fillStyle=g;x.fillRect(0,0,w,h);const cards=[['COMMAND','OPERATE'],['RESULTS','VALIDATE'],['QC','CONTROL'],['GIA','ASSIST']];cards.forEach((a,i)=>{const cx=w*.18+i*w*.21+rx,cy=h*.5+(i%2?-18:18)+ry;const bw=180,bh=110;x.save();x.translate(cx,cy);x.rotate((i%2?-.012:.012));x.fillStyle='rgba(22,25,36,.92)';x.strokeStyle='rgba(180,170,255,.25)';x.lineWidth=2;x.beginPath();x.roundRect(-bw/2,-bh/2,bw,bh,18);x.fill();x.stroke();x.fillStyle='#e9e8ff';x.font='700 18px system-ui';x.fillText(a[0],-bw/2+18,-2);x.fillStyle='#8f91a5';x.font='12px system-ui';x.fillText(a[1],-bw/2+18,24);x.restore()})}
async function giaLaunchXR(){const st=document.getElementById('xrStatus');if(!navigator.xr){if(st)st.textContent='WEBXR UNAVAILABLE';toast('WebXR is unavailable on this browser/device. CSS spatial mode remains active.',false);return}try{const ok=await navigator.xr.isSessionSupported('immersive-vr');if(!ok){if(st)st.textContent='XR NOT SUPPORTED';toast('Immersive XR is not supported on this device.',false);return}if(st)st.textContent='XR AVAILABLE';const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});session.addEventListener('end',()=>{if(st)st.textContent='XR READY'});toast('Immersive XR session started')}catch(e){if(st)st.textContent='XR BLOCKED';toast('XR session could not start: '+e.message,false)}}
function giaWireSpatial(){const c=document.getElementById('giaSpatialCanvas');if(!c)return;giaDrawSpatial(c);const st=document.getElementById('xrStatus');if(st)st.textContent=navigator.xr?'WEBXR DETECTED':'CSS SPATIAL FALLBACK';}
const _giaShow=show;show=async function(v){await _giaShow(v);if(v==='spatial')giaWireSpatial()};
views.spatial=async()=>giaSpatialView();
const _giaBoot=boot;boot=async function(){await _giaBoot();giaUXInit()};
try{giaUXInit()}catch{}

</script>
